[project]
name = "map-build"
version = "0.1.0"
description = "Codebase map: treemap, call graph, and data model for one project."
requires-python = ">=3.12"
dependencies = [
  "tree-sitter",
  "tree-sitter-python",
  "tree-sitter-typescript",
  "lizard",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["map_build"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]
